# controllers.yaml
# Recall-Aware Controller configurations C1–C7
# FROZEN from thesis Table (Appendix 1 / Experiment Paper)
# Do NOT modify these values.
#
# Rolling Recall formula (thesis):
#   rolling_recall = sum(window_TP) / (sum(window_TP) + sum(window_FN))
#
# Update rules (thesis):
#   if rolling_recall < Rcritical:  state=Red;    next = current * fast_decay
#   elif rolling_recall < Rmin:     state=Yellow; next = current * slow_decay
#   else:                           state=Green;  next = current * growth_factor
#   next = clip(next, intensity_min, intensity_max)
#
# CRITICAL TIMING RULE:
#   Batch t is classified using intensity chosen BEFORE batch t labels are seen.
#   Batch t labels update only the intensity for batch t+1.
#   Carry-over of controller state between runs is PROHIBITED.

controller_configurations:

  C1:
    id: "C1"
    sensitivity_focus: "Balanced default"
    window_size: 5
    Rcritical: 0.85
    Rmin: 0.95
    fast_decay: 0.40
    slow_decay: 0.90
    growth_factor: 1.30
    primary_config: true   # C1 is used for RQ2 and RQ3 primary comparison

  C2:
    id: "C2"
    sensitivity_focus: "Very short window"
    window_size: 3
    Rcritical: 0.85
    Rmin: 0.95
    fast_decay: 0.40
    slow_decay: 0.90
    growth_factor: 1.05
    primary_config: false

  C3:
    id: "C3"
    sensitivity_focus: "Long window"
    window_size: 20
    Rcritical: 0.85
    Rmin: 0.95
    fast_decay: 0.40
    slow_decay: 0.90
    growth_factor: 1.05
    primary_config: false

  C4:
    id: "C4"
    sensitivity_focus: "Lenient threshold"
    window_size: 5
    Rcritical: 0.80
    Rmin: 0.90
    fast_decay: 0.40
    slow_decay: 0.90
    growth_factor: 1.05
    primary_config: false

  C5:
    id: "C5"
    sensitivity_focus: "Strict threshold"
    window_size: 5
    Rcritical: 0.90
    Rmin: 0.97
    fast_decay: 0.40
    slow_decay: 0.90
    growth_factor: 1.05
    primary_config: false

  C6:
    id: "C6"
    sensitivity_focus: "Conservative adjustment"
    window_size: 5
    Rcritical: 0.85
    Rmin: 0.95
    fast_decay: 0.60
    slow_decay: 0.95
    growth_factor: 1.02
    primary_config: false

  C7:
    id: "C7"
    sensitivity_focus: "Aggressive adjustment"
    window_size: 5
    Rcritical: 0.85
    Rmin: 0.95
    fast_decay: 0.25
    slow_decay: 0.80
    growth_factor: 1.10
    primary_config: false

# Warm-up rule (when fewer than W completed batches available):
# Use all completed batches currently available.
# First batch always uses the frozen base intensity.
warmup:
  rule: "use_all_available"
  first_batch_intensity: "frozen_base"

# Intensity bounds are mechanism-specific and set during calibration (Phase 8).
# The same bounds are used across C1-C7 for each mechanism.
# intensity_min and intensity_max for each defense are stored in defenses.yaml
# and applied uniformly across all controller configurations.
